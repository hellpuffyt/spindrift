# Spindrift pipeline — try it:
#   spindrift serve examples/spindrift.conf
#   curl -i localhost:8080/            curl localhost:8080/users/7?q=hi
#   curl -i localhost:8080/api/secret  curl -H 'X-Token: letmein' localhost:8080/api/secret
#   curl -N localhost:8080/events      curl localhost:8080/_spindrift/metrics
#   kill -HUP $(pgrep spindrift)       # edit this file first; routes swap live

listen :8080
log json
max_body 4MB
read_timeout 30s
idle_timeout 60s

# --- middleware runs in order before the first matching route ---
middleware * /*          -> header "Server" "Spindrift"
middleware * /*          -> cors "*"
middleware * /api/*      -> require header.X-Token == "letmein" else 401
middleware * /api/*      -> ratelimit 20/s burst 40
middleware * /admin/*    -> require remote == "127.0.0.1" || remote == "::1" else 403

# --- routes: first match wins ---
route GET /              -> respond 200 html "<!doctype html><h1>Spindrift</h1><p>path {{path}} at {{now}}</p>"
route GET,HEAD /health   -> respond 200 text "ok"
route GET /users/:id     -> respond 200 json "{\"id\":\"{{param.id}}\",\"q\":\"{{query.q}}\",\"from\":\"{{remote}}\"}"
route GET /api/secret    -> respond 200 json "{\"secret\":true}"
route GET /admin/status  -> respond 200 text "admin ok"
route GET /events        -> stream every 500ms "tick {{unix}}" count 5
route GET /old           -> redirect 301 "/health"
route * /static/*        -> files "examples/public"
route * /upstream/*      -> proxy "http://127.0.0.1:9000"
